<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#EEE8DE">
  <meta name="description" content="Алина Васильева — коммерческий директор и стратегический партнёр. Коммерческие системы, команды и измеримый рост.">
  <title>Алина Васильева — пространство для роста</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=7">
  <link rel="stylesheet" href="./hero-fix.css?v=7">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#hero" aria-label="Наверх">AV</a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Меню</button>
    <nav class="site-nav" id="site-nav" aria-label="Основная навигация">
      <a href="#hero">Обо мне</a>
      <a href="#hero">Кейсы</a>
      <a href="#hero">Опыт</a>
      <a href="#hero">Подход</a>
      <a href="#hero">Контакты</a>
      <span class="nav-dot" aria-hidden="true"></span>
    </nav>
  </header>

  <main class="site-main">
    <section class="hero" id="hero" aria-labelledby="hero-name">
      <div class="hero__word hero__word--left" aria-hidden="true">Growth</div>

      <div class="hero__portal" aria-hidden="true">
        <span class="hero__portal-edge hero__portal-edge--left"></span>
        <span class="hero__portal-edge hero__portal-edge--right"></span>
      </div>

      <figure class="hero__portrait">
        <img
          src="../alina-portrait-transparent.png?v=7"
          alt="Алина Васильева в чёрном образе сидит на высоком стуле в красных туфлях"
          width="1920"
          height="1080"
          loading="eager"
          fetchpriority="high"
          decoding="async"
        >
      </figure>

      <div class="hero__word hero__word--right" aria-hidden="true">
        <span>Needs</span>
        <span class="accent">Space.</span>
      </div>

      <div class="hero__copy">
        <h1 id="hero-name">Алина Васильева</h1>
        <p class="hero__role">Стратегический партнёр</p>
        <p class="hero__lead">
          Строю стратегии, коммерческие системы и команды,
          которые превращают развитие в измеримый рост.
        </p>
        <a class="text-link" href="#hero">
          <span>Обсудить рост</span>
          <span aria-hidden="true">→</span>
        </a>
      </div>

      <div class="hero__principles" aria-label="Ключевые направления">
        <span>Стратегия</span>
        <span>Команды</span>
        <span>Рост</span>
      </div>

      <p class="hero__footer" aria-hidden="true">Стратегия · Системы · Рост</p>
    </section>
  </main>

  <script src="./script.js"></script>
</body>
</html>
