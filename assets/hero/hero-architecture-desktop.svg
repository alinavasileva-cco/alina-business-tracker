<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1350" viewBox="0 0 2400 1350" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wallL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9ded4"/>
      <stop offset="0.58" stop-color="#e5d9ce"/>
      <stop offset="0.86" stop-color="#dfd1c5"/>
      <stop offset="1" stop-color="#d8c9bb"/>
    </linearGradient>
    <linearGradient id="wallR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#e8ddd3"/>
      <stop offset="0.58" stop-color="#e4d8cd"/>
      <stop offset="0.86" stop-color="#ddcfc2"/>
      <stop offset="1" stop-color="#d5c6b8"/>
    </linearGradient>
    <linearGradient id="revealL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cdbbad"/>
      <stop offset="0.20" stop-color="#ded0c3"/>
      <stop offset="0.48" stop-color="#eee3da"/>
      <stop offset="0.70" stop-color="#e1d2c5"/>
      <stop offset="1" stop-color="#b29f90"/>
    </linearGradient>
    <linearGradient id="revealR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#aa998a"/>
      <stop offset="0.27" stop-color="#cdbcae"/>
      <stop offset="0.60" stop-color="#efe4da"/>
      <stop offset="0.82" stop-color="#dfd0c3"/>
      <stop offset="1" stop-color="#bfad9d"/>
    </linearGradient>
    <linearGradient id="niche" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9afa3"/>
      <stop offset="0.19" stop-color="#c3b9ae"/>
      <stop offset="0.52" stop-color="#c8bfb5"/>
      <stop offset="0.77" stop-color="#beb6ad"/>
      <stop offset="1" stop-color="#aea69d"/>
    </linearGradient>
    <radialGradient id="nicheLight" cx="52%" cy="43%" rx="45%" ry="43%">
      <stop offset="0" stop-color="#fffaf4" stop-opacity="0.16"/>
      <stop offset="0.43" stop-color="#fffaf4" stop-opacity="0.065"/>
      <stop offset="1" stop-color="#fffaf4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3e3026" stop-opacity="0.13"/>
      <stop offset="0.45" stop-color="#3e3026" stop-opacity="0.035"/>
      <stop offset="1" stop-color="#3e3026" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="castL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#392b22" stop-opacity="0.19"/>
      <stop offset="0.30" stop-color="#392b22" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#392b22" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="castR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#392b22" stop-opacity="0.14"/>
      <stop offset="0.32" stop-color="#392b22" stop-opacity="0.075"/>
      <stop offset="1" stop-color="#392b22" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bbb3aa"/>
      <stop offset="0.48" stop-color="#b3aba2"/>
      <stop offset="1" stop-color="#aaa299"/>
    </linearGradient>
    <linearGradient id="floorLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fffaf4" stop-opacity="0.06"/>
      <stop offset="0.46" stop-color="#fffaf4" stop-opacity="0.01"/>
      <stop offset="1" stop-color="#4c3b30" stop-opacity="0.055"/>
    </linearGradient>
    <filter id="blur40" x="-40%" y="-20%" width="180%" height="140%"><feGaussianBlur stdDeviation="32"/></filter>
    <filter id="blur70" x="-50%" y="-30%" width="200%" height="160%"><feGaussianBlur stdDeviation="52"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="2" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0.9 0 0 0 0.05  0 0.82 0 0 0.045  0 0 0.75 0 0.04  0 0 0 0.032 0" result="grainNoise"/>
      <feBlend in="SourceGraphic" in2="grainNoise" mode="multiply"/>
    </filter>
  </defs>

  <g filter="url(#grain)">
    <rect width="2400" height="1350" fill="#e4d7cc"/>
    <rect x="0" y="0" width="852" height="1220" fill="url(#wallL)"/>
    <rect x="852" y="0" width="50" height="1220" fill="url(#revealL)"/>
    <rect x="902" y="0" width="600" height="1220" fill="url(#niche)"/>
    <rect x="902" y="0" width="600" height="1220" fill="url(#nicheLight)"/>
    <rect x="1502" y="0" width="50" height="1220" fill="url(#revealR)"/>
    <rect x="1552" y="0" width="848" height="1220" fill="url(#wallR)"/>

    <rect x="858" y="0" width="118" height="1220" fill="url(#castL)" filter="url(#blur40)"/>
    <rect x="1432" y="0" width="118" height="1220" fill="url(#castR)" filter="url(#blur40)"/>
    <rect x="902" y="0" width="600" height="210" fill="url(#topShade)" filter="url(#blur40)"/>

    <rect x="0" y="1220" width="2400" height="130" fill="url(#floor)"/>
    <rect x="0" y="1220" width="2400" height="130" fill="url(#floorLight)"/>
    <ellipse cx="914" cy="1245" rx="105" ry="66" fill="#45362c" fill-opacity="0.11" filter="url(#blur70)"/>
    <ellipse cx="1502" cy="1246" rx="92" ry="62" fill="#45362c" fill-opacity="0.075" filter="url(#blur70)"/>
    <rect x="890" y="1198" width="42" height="152" fill="#4b3a2f" fill-opacity="0.055" filter="url(#blur40)"/>
    <rect x="1480" y="1198" width="42" height="152" fill="#4b3a2f" fill-opacity="0.04" filter="url(#blur40)"/>
  </g>
</svg>