name: Visual QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/clean_portrait_v11.py'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/visual-qa.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/clean_portrait_v11.py'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/visual-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Prepare complete font subsets
        run: |
          curl --fail --location --retry 3 \
            'https://cdn.jsdelivr.net/fontsource/fonts/manrope:vf@5.3.0/latin-wght-normal.woff2' \
            --output src/assets/fonts/manrope-latin-wght-normal.woff2
          curl --fail --location --retry 3 \
            'https://cdn.jsdelivr.net/fontsource/fonts/noto-serif-display:vf@5.3.0/latin-wght-normal.woff2' \
            --output src/assets/fonts/noto-serif-display-latin-wght-normal.woff2

      - name: Clean portrait alpha edge
        run: |
          python -m pip install --disable-pip-version-check pillow numpy scipy
          git show 1481328f4e5af141e9c4150f0b6776db0b0d868a:v2/assets/alina-portrait-clean.png > /tmp/alina-portrait-source.png
          python tools/clean_portrait_v11.py /tmp/alina-portrait-source.png src/assets/hero/alina-portrait.png

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Install Chromium
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/vite-preview.log 2>&1 &
          echo $! > /tmp/vite-preview.pid
          curl --fail --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:4173/alina-business-tracker/ > /dev/null || { cat /tmp/vite-preview.log; exit 1; }

      - name: Capture screenshots
        run: |
          mkdir -p screenshots
          npx --yes playwright@1.55.0 screenshot --browser chromium --viewport-size='1920,1080' http://127.0.0.1:4173/alina-business-tracker/ screenshots/desktop-1920x1080.png
          npx --yes playwright@1.55.0 screenshot --browser chromium --viewport-size='1440,900' --full-page http://127.0.0.1:4173/alina-business-tracker/ screenshots/desktop-full-1440.png
          npx --yes playwright@1.55.0 screenshot --browser chromium --viewport-size='390,844' http://127.0.0.1:4173/alina-business-tracker/ screenshots/mobile-390x844.png
          npx --yes playwright@1.55.0 screenshot --browser chromium --viewport-size='390,844' --full-page http://127.0.0.1:4173/alina-business-tracker/ screenshots/mobile-full-390.png

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-screenshots
          path: screenshots/*.png
          if-no-files-found: error
          retention-days: 7
