name: Compact case height v13

on:
  push:
    branches: [fix/editorial-rhythm-v13]
    paths:
      - '.github/workflows/compact-case-height-v13.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/editorial-rhythm-v13
          fetch-depth: 0

      - name: Remove viewport-driven whitespace from cases
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/styles/cases.css')
          s = p.read_text()
          changes = [
            ("  min-height: clamp(620px, 68svh, 760px);", "  min-height: 0;"),
            ("  min-height: inherit;\n  grid-template-columns:", "  min-height: 0;\n  grid-template-columns:"),
            ("@media (max-width: 1200px) {\n  .case-study {\n    min-height: clamp(640px, 72svh, 780px);\n  }\n\n", "@media (max-width: 1200px) {\n"),
            ("\n  .case-study {\n    min-height: 680px;\n  }\n\n  .case-study__inner {", "\n  .case-study__inner {"),
          ]
          for old,new in changes:
              if old not in s:
                  raise SystemExit(f'Missing expected block: {old}')
              s = s.replace(old,new,1)
          p.write_text(s)
          PY

      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/compact-case-height-v13.yml
          git config user.name 'Commercial'
          git config user.email '135322806+alinavasileva-cco@users.noreply.github.com'
          git add src/styles/cases.css .github/workflows/compact-case-height-v13.yml
          git commit -m 'Make case height content-driven'
          git push origin HEAD:fix/editorial-rhythm-v13
