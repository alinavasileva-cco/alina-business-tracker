name: Apply editorial rhythm v13

on:
  push:
    branches: [fix/editorial-rhythm-v13]
    paths:
      - '.github/workflows/apply-editorial-rhythm-v13.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/editorial-rhythm-v13
          fetch-depth: 0

      - name: Apply exact typography and rhythm edits
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/styles/integrated.css')
          s = p.read_text()
          replacements = [
            ("  font-weight: 600;\n  letter-spacing: .09em;\n  text-transform: uppercase;\n}\n\n.menu-toggle", "  font-weight: 400;\n  letter-spacing: .07em;\n  text-transform: uppercase;\n}\n\n.menu-toggle"),
            ("  font-size: clamp(1.16rem, 1.3vw, 1.48rem);\n  font-weight: 600;", "  font-size: clamp(1.16rem, 1.3vw, 1.48rem);\n  font-weight: 500;"),
            ("  font-size: clamp(.62rem, .7vw, .77rem);\n  font-weight: 500;", "  font-size: clamp(.62rem, .7vw, .77rem);\n  font-weight: 400;"),
            ("  font-size: clamp(.74rem, .86vw, .96rem);\n  font-weight: 600;", "  font-size: clamp(.74rem, .86vw, .96rem);\n  font-weight: 400;"),
            ("  font-size: .66rem;\n  font-weight: 500;\n  letter-spacing: .035em;", "  font-size: .66rem;\n  font-weight: 400;\n  letter-spacing: .03em;"),
            (".services--v9 {\n  padding-block: clamp(64px, 5.2vw, 96px);\n}", ".services--v9 {\n  padding: clamp(52px, 4.2vw, 76px) 0 clamp(30px, 2.4vw, 44px);\n}"),
            (".services-v9__item h3 {\n  font-family: var(--serif);\n  font-size: clamp(1.62rem, 1.88vw, 2.26rem);\n  font-weight: 300;\n  font-variation-settings: 'wght' 300;\n  letter-spacing: -.035em;\n  line-height: 1.03;\n}", ".services-v9__item h3 {\n  font-family: var(--sans);\n  font-size: clamp(1.05rem, 1.22vw, 1.3rem);\n  font-weight: 400;\n  letter-spacing: -.015em;\n  line-height: 1.25;\n}"),
            (".experience-v9__role h3 {\n  max-width: 650px;\n  color: rgb(24 19 15 / 92%);\n  font-family: var(--serif);\n  font-size: clamp(1.3rem, 1.72vw, 1.98rem);\n  font-weight: 300;\n  font-variation-settings: 'wght' 300;\n  font-optical-sizing: none;\n  letter-spacing: -.034em;\n  line-height: 1.07;\n}", ".experience-v9__role h3 {\n  max-width: 650px;\n  color: rgb(24 19 15 / 92%);\n  font-family: var(--sans);\n  font-size: clamp(1.08rem, 1.35vw, 1.48rem);\n  font-weight: 400;\n  letter-spacing: -.018em;\n  line-height: 1.2;\n}"),
            ("  font-size: .62rem;\n  font-weight: 500;\n  letter-spacing: .08em;", "  font-size: .62rem;\n  font-weight: 400;\n  letter-spacing: .07em;"),
            ("  font-size: .64rem;\n  font-weight: 500;\n  letter-spacing: .1em;", "  font-size: .64rem;\n  font-weight: 400;\n  letter-spacing: .08em;"),
            (".education-v9__item time {\n  color: var(--muted);\n  font-family: var(--serif);\n  font-size: 1.1rem;\n  font-weight: 300;\n}", ".education-v9__item time {\n  color: var(--muted);\n  font-family: var(--sans);\n  font-size: .88rem;\n  font-weight: 400;\n}"),
            (".education-v9__item h3 {\n  margin-top: 20px;\n  font-family: var(--serif);\n  font-size: clamp(1.16rem, 1.46vw, 1.64rem);\n  font-weight: 300;\n  font-variation-settings: 'wght' 300;\n  letter-spacing: -.025em;\n  line-height: 1.08;\n}", ".education-v9__item h3 {\n  margin-top: 20px;\n  font-family: var(--sans);\n  font-size: clamp(1rem, 1.12vw, 1.22rem);\n  font-weight: 400;\n  letter-spacing: -.012em;\n  line-height: 1.25;\n}"),
            (".contact__links a {\n  min-width: 0;\n  padding-block: 11px 17px;\n  font-family: var(--serif);\n  font-size: 1.06rem;\n  font-weight: 300;", ".contact__links a {\n  min-width: 0;\n  padding-block: 11px 17px;\n  font-family: var(--sans);\n  font-size: .92rem;\n  font-weight: 400;"),
            ("  font-size: .54rem;\n  font-weight: 500;\n  letter-spacing: .09em;", "  font-size: .54rem;\n  font-weight: 400;\n  letter-spacing: .07em;"),
            ("  .site-nav.is-open a {\n    padding: 12px 0;\n    font-family: var(--serif);\n    font-size: 1.55rem;\n    font-weight: 300;\n    text-transform: none;\n  }", "  .site-nav.is-open a {\n    padding: 12px 0;\n    font-family: var(--sans);\n    font-size: 1rem;\n    font-weight: 400;\n    letter-spacing: .04em;\n    text-transform: uppercase;\n  }"),
            ("    font-size: .59rem;\n    font-weight: 500;\n    letter-spacing: .03em;", "    font-size: .59rem;\n    font-weight: 400;\n    letter-spacing: .025em;"),
            ("  .services--v9,\n  .education--v9 {\n    padding-block: 64px;\n  }", "  .services--v9 {\n    padding: 48px 0 32px;\n  }\n\n  .education--v9 {\n    padding-block: 56px;\n  }"),
            ("  .services-v9__item h3 {\n    font-size: 1.68rem;\n  }", "  .services-v9__item h3 {\n    font-size: 1.08rem;\n  }"),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Missing expected block:\n{old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/apply-editorial-rhythm-v13.yml
          git config user.name 'Commercial'
          git config user.email '135322806+alinavasileva-cco@users.noreply.github.com'
          git add src/styles/integrated.css .github/workflows/apply-editorial-rhythm-v13.yml
          git commit -m 'Tighten scroll rhythm and simplify font system'
          git push origin HEAD:fix/editorial-rhythm-v13
