name: Build hero inline preview

on:
  push:
    branches:
      - fix/surgical-restore
    paths:
      - '.github/workflows/build-hero-assets.yml'
      - 'assets/hero/approved-desktop.webp'
      - 'assets/hero/approved-tablet.webp'
      - 'assets/hero/approved-mobile.webp'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/surgical-restore
          fetch-depth: 0

      - name: Build self-contained responsive preview
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          root = Path('.')
          assets = root / 'assets' / 'hero'
          images = {
              'desktop': base64.b64encode((assets / 'approved-desktop.webp').read_bytes()).decode('ascii'),
              'tablet': base64.b64encode((assets / 'approved-tablet.webp').read_bytes()).decode('ascii'),
              'mobile': base64.b64encode((assets / 'approved-mobile.webp').read_bytes()).decode('ascii'),
          }

          html = f'''<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e8ddd1"><title>Алина Васильева — Hero Final</title><style>*{{box-sizing:border-box}}html,body{{margin:0;padding:0;background:#e8ddd1}}body{{overflow-x:hidden}}main,img{{display:block;width:100%;margin:0}}img{{width:100%;height:auto}}@media(max-width:767px){{.desktop,.tablet{{display:none!important}}.mobile{{display:block!important}}}}@media(min-width:768px) and (max-width:1199px){{.desktop,.mobile{{display:none!important}}.tablet{{display:block!important}}}}@media(min-width:1200px){{.tablet,.mobile{{display:none!important}}.desktop{{display:block!important}}}}</style></head><body><main><img class="desktop" src="data:image/webp;base64,{images['desktop']}" alt="Алина Васильева — desktop"><img class="tablet" src="data:image/webp;base64,{images['tablet']}" alt="Алина Васильева — tablet"><img class="mobile" src="data:image/webp;base64,{images['mobile']}" alt="Алина Васильева — mobile"></main></body></html>'''
          Path('hero-final-inline.html').write_text(html, encoding='utf-8')
          print('hero-final-inline.html bytes:', Path('hero-final-inline.html').stat().st_size)
          PY

      - name: Commit inline preview
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hero-final-inline.html
          if git diff --cached --quiet; then
            echo "Inline preview unchanged."
          else
            git commit -m "build(hero): add self-contained responsive preview"
            git push origin HEAD:fix/surgical-restore
          fi
