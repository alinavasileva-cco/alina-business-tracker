name: Build hero assets

on:
  push:
    branches:
      - fix/surgical-restore
    paths:
      - 'hero-assets/**'
      - '.github/workflows/build-hero-assets.yml'
      - 'assets/final/hero-final.webp'
      - 'v4/assets/portrait/alina-portrait-rgba-final.png'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/surgical-restore
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy scipy opencv-python-headless

      - name: Generate clean plates and portrait
        run: python hero-assets/build_hero_assets.py

      - name: Commit generated assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero/hero-architecture-reference-clean.png \
                  assets/hero/hero-architecture-desktop.webp \
                  assets/hero/hero-architecture-tablet.webp \
                  assets/hero/hero-architecture-mobile.webp \
                  assets/hero/alina-portrait-clean.png \
                  assets/hero/alina-portrait-clean.webp \
                  assets/hero/asset-report.txt
          if git diff --cached --quiet; then
            echo "Generated assets are unchanged."
          else
            git commit -m "build(hero): regenerate approved-reference assets"
            git push origin HEAD:fix/surgical-restore
          fi
